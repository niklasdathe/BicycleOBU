name: Assemble requirements v1.2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble workbook
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p requirements
          cat .tmp-requirements/BicycleOBU_Requirements_v1_2_Modular.xlsx.b64.part-* > /tmp/workbook.b64
          base64 --decode /tmp/workbook.b64 > requirements/BicycleOBU_Requirements_v1_2_Modular.xlsx
          test "$(sha256sum requirements/BicycleOBU_Requirements_v1_2_Modular.xlsx | cut -d' ' -f1)" = "429c2b94595126e57303ace7d6e13547cd9fc66e9e4b340b36d60bd0c227045e"
      - name: Commit assembled workbook
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add requirements/BicycleOBU_Requirements_v1_2_Modular.xlsx
          git rm -r .tmp-requirements
          git rm .github/workflows/assemble-requirements-v1-2.yml
          git commit -m "assemble modular requirements workbook"
          git push
